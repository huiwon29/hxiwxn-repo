<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>행운의 룰렛</title>
  <link rel="stylesheet" href="../assets/common.css" />
  <style>
    .wheel-wrap {
      position: relative;
      width: min(300px, 78vw);
      margin: 0 auto 28px;
    }
    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
      z-index: 2;
      filter: drop-shadow(0 2px 3px rgba(38, 34, 27, 0.3));
    }
    #wheel {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 8px solid #fff;
      box-shadow: 0 4px 16px rgba(38, 34, 27, 0.15);
      position: relative;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.25, 1);
    }
    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
    }
    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(38, 34, 27, 0.2);
      z-index: 1;
    }
    #result {
      min-height: 2.2rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: #e8632c;
      margin-bottom: 20px;
      word-break: keep-all;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #result.show { opacity: 1; animation: pop 0.45s ease; }
    #spin-btn { width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div id="congrats"></div>
    <h1 id="title"></h1>
    <div class="wheel-wrap">
      <div class="pointer">🔻</div>
      <div id="wheel"><div class="hub"></div></div>
    </div>
    <div id="result"></div>
    <button class="btn primary" id="spin-btn"></button>
  </div>

  <script src="../assets/config.js"></script>
  <script src="../assets/common.js"></script>
  <script>
    const STAGE_N = 4;
    initStage(STAGE_N);

    // ===== 문구 설정: 여기만 수정하면 됩니다 =====
    const TEXT = {
      title:    "오늘의 운명은...? 룰렛을 돌려보세요!",
      spinBtn:  "돌리기!",
      againBtn: "한 번 더!",
      resultPrefix: "🎯 ",
      items: ["커피 사주기", "저녁 사주기", "칭찬 세례 받기", "산책 같이 가기", "소원권 1장", "안마 10분"],
      riggedIndex: null,   // 숫자를 넣으면 항상 그 결과만 나옴 (0부터 시작). null이면 진짜 랜덤
    };
    // ============================================

    document.getElementById("title").textContent = TEXT.title;
    const spinBtn = document.getElementById("spin-btn");
    spinBtn.textContent = TEXT.spinBtn;

    const wheel = document.getElementById("wheel");
    const N = TEXT.items.length;
    const seg = 360 / N;
    const SEG_COLORS = ["#e8632c", "#f4b23e", "#4d9d6a", "#3d7bd9", "#d94f70", "#8a5cc9", "#2f9e9b", "#b0713a"];

    // 원판 그리기 (conic-gradient는 12시 방향부터 시계방향)
    const stops = [];
    for (let i = 0; i < N; i++) {
      const c = SEG_COLORS[i % SEG_COLORS.length];
      stops.push(c + " " + (i * seg) + "deg " + ((i + 1) * seg) + "deg");
    }
    wheel.style.background = "conic-gradient(" + stops.join(", ") + ")";

    // 칸 이름 배치
    const radius = () => wheel.clientWidth / 2;
    for (let i = 0; i < N; i++) {
      const label = document.createElement("div");
      label.className = "wheel-label";
      label.textContent = TEXT.items[i];
      const angle = i * seg + seg / 2;
      label.style.transform = "rotate(" + (angle - 90) + "deg) translateX(" + (radius() * 0.42) + "px) translateY(-50%)";
      wheel.appendChild(label);
    }

    let spinning = false;
    let totalRotation = 0;
    const resultEl = document.getElementById("result");

    function spin() {
      if (spinning) return;
      spinning = true;
      resultEl.classList.remove("show");
      spinBtn.disabled = true;

      const winner = (TEXT.riggedIndex !== null && TEXT.riggedIndex >= 0 && TEXT.riggedIndex < N)
        ? TEXT.riggedIndex
        : Math.floor(Math.random() * N);

      // 당첨 칸 중앙이 12시 포인터에 오도록 회전량 계산 (+ 칸 안에서 약간 랜덤)
      const jitter = (Math.random() - 0.5) * seg * 0.6;
      const winnerCenter = winner * seg + seg / 2 + jitter;
      const current = totalRotation % 360;
      totalRotation += 360 * 5 + ((360 - winnerCenter - current) % 360 + 360) % 360;
      wheel.style.transform = "rotate(" + totalRotation + "deg)";

      setTimeout(() => {
        spinning = false;
        spinBtn.disabled = false;
        spinBtn.textContent = TEXT.againBtn;
        resultEl.textContent = TEXT.resultPrefix + TEXT.items[winner];
        resultEl.classList.add("show");
        fireworks();
        stageComplete(STAGE_N);
      }, 4200);
    }

    spinBtn.addEventListener("click", spin);
  </script>
</body>
</html>
