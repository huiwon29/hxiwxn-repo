<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>스크래치 복권</title>
  <link rel="stylesheet" href="../assets/common.css" />
  <style>
    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 5 / 3;
      background: #fff;
      box-shadow: 0 2px 8px rgba(38, 34, 27, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .secret {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      word-break: keep-all;
      line-height: 1.5;
      color: #e8632c;
    }
    #scratch {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      transition: opacity 0.6s ease;
    }
    #scratch.revealed { opacity: 0; pointer-events: none; }
    .hint {
      text-align: center;
      color: #8a8375;
      font-size: 0.9rem;
      margin-top: 18px;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="congrats"></div>
    <h1 id="title"></h1>
    <div class="card">
      <div class="secret" id="secret"></div>
      <canvas id="scratch"></canvas>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <script src="../assets/config.js"></script>
  <script src="../assets/common.js"></script>
  <script>
    const STAGE_N = 3;
    initStage(STAGE_N);

    // ===== 문구 설정: 여기만 수정하면 됩니다 =====
    const TEXT = {
      title:   "행운의 복권이 도착했어요!",
      cover:   "여기를 긁어보세요 👆",
      secret:  "🎉 당첨! 숨겨진 메시지를 여기에 적어주세요",
      hint:    "손가락으로 은색 부분을 벅벅 긁어보세요",
      correct: "당첨! 🎉",
    };
    // ============================================

    document.getElementById("title").textContent = TEXT.title;
    document.getElementById("secret").textContent = TEXT.secret;
    document.getElementById("hint").textContent = TEXT.hint;

    const canvas = document.getElementById("scratch");
    const ctx = canvas.getContext("2d");
    let revealed = false;
    let scratching = false;
    let lastX = 0, lastY = 0;
    let moveCount = 0;

    function setupCover() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      // 은박 커버
      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, "#c8c2b4");
      grad.addColorStop(0.5, "#aaa393");
      grad.addColorStop(1, "#c8c2b4");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#fff";
      ctx.font = "600 17px -apple-system, 'Apple SD Gothic Neo', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(TEXT.cover, rect.width / 2, rect.height / 2);
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = 44;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }
    setupCover();

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function scratchedRatio() {
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let transparent = 0, total = 0;
      for (let i = 3; i < data.length; i += 64) { // 16픽셀 간격 샘플링
        total++;
        if (data[i] === 0) transparent++;
      }
      return transparent / total;
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      canvas.classList.add("revealed");
      fireworks();
      showCongrats(TEXT.correct);
      stageComplete(STAGE_N);
    }

    function checkProgress() {
      if (!revealed && scratchedRatio() >= 0.7) reveal();
    }

    canvas.addEventListener("pointerdown", e => {
      if (revealed) return;
      scratching = true;
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      lastX = p.x; lastY = p.y;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 0.1, p.y + 0.1);
      ctx.stroke();
    });

    canvas.addEventListener("pointermove", e => {
      if (!scratching || revealed) return;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
      if (++moveCount % 20 === 0) checkProgress();
    });

    function endScratch() {
      if (!scratching) return;
      scratching = false;
      checkProgress();
    }
    canvas.addEventListener("pointerup", endScratch);
    canvas.addEventListener("pointercancel", endScratch);
  </script>
</body>
</html>
